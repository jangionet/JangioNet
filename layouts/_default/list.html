{{ define "main" }}
  <main class="section-page">
    <h1>{{ .Title }}</h1>

    <ul class="post-list">
      {{ range .Pages.ByDate.Reverse }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          <small class="post-meta">
            – <time datetime="{{ .Date.Format "2006-01-02" }}">
                {{ .Date.Format site.Params.dateFormat }}
              </time>
          </small>
        </li>
      {{ end }}
    </ul>
  </main>
{{ end }}
